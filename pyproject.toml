[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liiontr"
version = "0.0.1"
description = "Lithium-ion thermal runaway framework"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Francois Dion" }
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
]

[tool.pytest.ini_options]

testpaths = ["tests"]

[tool.black]

line-length = 88

target-version = ["py312"]

[tool.ruff]

line-length = 88

target-version = "py312"

[tool.mypy]

python_version = "3.12"

strict = false

[tool.ruff.lint.pydocstyle]
convention = "numpy"